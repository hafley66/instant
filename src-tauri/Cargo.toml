[package]
name = "instant"
default-run = "instant"
version = "0.1.16"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "instant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
mouse_position = "0.1"
core-graphics = "0.25"
core-foundation = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
tiny_http = "0.12"
base64 = "0.22"
libc = "0.2"
png = "0.17"
tungstenite = "0.29"
arboard = "3"
notify = "8.2"
ignore = "0.4"
boop-mux = { path = "../../hafley-rs/crates/boop-mux" }
boop-store = { path = "../../hafley-rs/crates/boop-store", default-features = false, features = ["agent-read"] }
boop-harness = { path = "../../hafley-rs/crates/boop-harness" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSThread"] }

# `tauri dev` ships this binary to 8 live agent panes; opt-level 0 made the
# IPC/JSON path ~3x slower than needed (measured 2026-08-22).
[profile.dev]
opt-level = 1
