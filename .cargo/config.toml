# 192.168.1.67:8001, not 127.0.0.1:8000 — the local.sparkup.tunnels LaunchAgent
# forwards 127.0.0.1:8000 to spark-1's SillyTavern and swallows kellnr there.
# The LAN address (not loopback) also makes this work under rcargo, which builds
# on spark-2 where 127.0.0.1 is the Spark's own loopback.
index = "sparse+http://192.168.1.67:8001/api/v1/crates/"
