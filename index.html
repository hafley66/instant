<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instant</title>
    <script>
      // Install diagnostics before the module graph starts. A SyntaxError while
      // evaluating an imported module prevents src/main.ts from running, so its
      // normal error listeners cannot observe that failure. Tauri initializes
      // __TAURI_INTERNALS__ before document scripts execute; the queue keeps
      // browser/dev loads harmless when that bridge is absent.
      (() => {
        const queue = (window.__instantEarlyDiagnostics = window.__instantEarlyDiagnostics || []);
        const stringify = (value) => {
          if (value instanceof Error) return `${value.message}\n${value.stack || ""}`;
          if (typeof value === "string") return value;
          try { return JSON.stringify(value); } catch (_) { return String(value); }
        };
        const send = (kind, value, extra) => {
          const line = `[frontend.${kind}] ${stringify(value)}${extra ? ` ${extra}` : ""}`;
          const invoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
          if (typeof invoke !== "function") {
            queue.push(line);
            return;
          }
          invoke("log_append", { line: `${new Date().toISOString()} ${line}` }).catch(() => {});
        };
        window.addEventListener("error", (event) => {
          send("error", event.error || event.message, `source=${event.filename || ""}:${event.lineno || 0}:${event.colno || 0}`);
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          send("unhandledrejection", event.reason);
        }, true);
        window.addEventListener("load", () => {
          if (queue.length === 0) return;
          const invoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
          if (typeof invoke !== "function") return;
          while (queue.length) invoke("log_append", { line: `${new Date().toISOString()} ${queue.shift()}` }).catch(() => {});
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body data-skin="xp">
    <div class="window summon" id="app">
      <div class="title-bar">
        <div class="title-bar-text">instant — summon</div>
        <div class="title-bar-controls">
          <button id="min-btn" aria-label="Minimize"></button>
          <button id="max-btn" aria-label="Maximize"></button>
          <button id="hide-btn" aria-label="Close"></button>
        </div>
      </div>

      <div class="toolbar">
        <button id="shot-btn" class="shot-btn" title="Screenshot region into the active terminal">
          ⛶ Shot
        </button>
        <button id="send-menu-btn" class="send-menu-btn" title="Send a screenshot or selection to a terminal…">
          ▾
        </button>
        <button id="mode-toggle" class="mode-toggle" title="Toggle dark mode">
          ☾
        </button>
        <button id="diagram-toggle" title="Toggle inline Mermaid/D2 renders">
          ◇
        </button>
        <button id="panic-toggle" title="Toggle the red panic button">
          ⏹
        </button>
        <button id="turn-debug-toggle" title="Toggle the turn attribution debug overlay">
          ⛭
        </button>
        <button id="structured-overlay-toggle" title="Toggle table/list selection checkboxes">
          ☑
        </button>
        <span class="toolbar-spacer"></span>
        <button id="skin-toggle" class="skin-toggle">P5</button>
      </div>

      <div class="window-body body" id="workbench">
        <nav class="actbar" id="actbar">
          <!-- actbar-panels injected by rail.ts (drag-reorder + hide), via plugin.tsx buildActivityRail() -->
          <span class="actbar-spacer"></span>
          <button class="actbar-item" id="actbar-toggle" title="Toggle compact/expanded">
            <span class="ai">⇆</span><span class="al">Collapse</span>
          </button>
        </nav>
        <div class="actbar-resize" id="actbar-resize" title="Drag to resize the rail"></div>
        <div class="dock" id="dock"></div>
      </div>

      <!-- Panel pool: parks terminal/browser/preview host elements between
           dockview mounts (see reactdock.tsx, terminal.ts, browser.ts). Every
           panel is a React `component` now; nothing is injected here. -->
      <div id="panel-pool" hidden></div>

      <div class="rz" data-dir="North"></div>
      <div class="rz" data-dir="South"></div>
      <div class="rz" data-dir="West"></div>
      <div class="rz" data-dir="East"></div>
      <div class="rz" data-dir="NorthWest"></div>
      <div class="rz" data-dir="NorthEast"></div>
      <div class="rz" data-dir="SouthWest"></div>
      <div class="rz" data-dir="SouthEast"></div>
    </div>

    <!-- Panic button overlay. Deliberately a sibling of #app, never a child:
         #app carries the summon-in animation and the overlay-faded opacity, and
         a composited or transformed ancestor flattens the button's preserve-3d
         cylinder into a single plane, which reads as permanently pressed. -->
    <div id="stfu-host"></div>
  </body>
</html>
