name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
      - id: release
        name: Read GitHub release identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME --jq .id)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    # The repo's .cargo/config.toml names kellnr at 192.168.1.67:8001, a LAN
    # address a runner cannot reach, and 127.0.0.1:8000 is shadowed by a tunnel
    # agent on the Macs. So stand up a runner-local kellnr here and let env
    # (which beats the config file) point cargo at it.
    env:
      CARGO_REGISTRIES_HAFLEY_INDEX: sparse+http://127.0.0.1:8001/api/v1/crates/
      CARGO_REGISTRIES_HAFLEY_TOKEN: kellnr
    steps:
      - uses: actions/checkout@v4

      # src-tauri/Cargo.toml:41-44 reach ../../hafley-rs/crates/* by path, and
      # actions/checkout refuses any path outside the workspace, so clone it.
      - name: Check out the hafley-rs sibling checkout
        run: |
          rev="$(tr -d '[:space:]' < hafley-rs.rev)"
          dest="$(dirname "$GITHUB_WORKSPACE")/hafley-rs"
          git clone --filter=blob:none https://github.com/hafley66/hafley-rs.git "$dest"
          git -C "$dest" checkout --detach "$rev"
          echo "hafley-rs pinned at $rev"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kellnr
          key: kellnr-${{ runner.os }}-${{ runner.arch }}

      - name: Start the runner-local kellnr registry
        run: |
          test -x "$HOME/.cargo/bin/kellnr" || cargo install kellnr --locked
          mkdir -p "$RUNNER_TEMP/kellnr-data"
          cat > "$RUNNER_TEMP/kellnr.toml" <<'EOF'
          [setup]
          admin_pwd = "admin"

          [registry]
          data_dir = ""
          auth_required = false
          new_crates_restricted = false
          allow_ownerless_crates = false

          [local]
          ip = "127.0.0.1"
          port = 8001

          [origin]
          hostname = "127.0.0.1"
          port = 8001
          protocol = "http"
          path = ""

          [log]
          format = "compact"
          level = "warn"
          level_web_server = "warn"

          [docs]
          enabled = false

          [proxy]
          enabled = false

          [postgresql]
          enabled = false

          [s3]
          enabled = false

          [oauth2]
          enabled = false

          [toolchain]
          enabled = false
          EOF
          "$HOME/.cargo/bin/kellnr" start -c "$RUNNER_TEMP/kellnr.toml" -d "$RUNNER_TEMP/kellnr-data" &
          for _ in $(seq 90); do
            curl -sf http://127.0.0.1:8001/api/v1/crates/config.json >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/api/v1/crates/config.json >/dev/null

      # Crates reference each other by path, so a first pass publishes only the
      # leaves; later passes walk up the graph. Failures are retried, not fatal.
      - name: Seed the registry with the pinned hafley crates
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/hafley-rs"
          for _ in 1 2 3 4 5 6 7 8; do
            for m in crates/*/Cargo.toml; do
              cargo publish --manifest-path "$m" --registry hafley --no-verify --allow-dirty || true
            done
          done

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check tag and package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          grep -qx "version = \"$version\"" src-tauri/Cargo.toml
          grep -qx "  \"version\": \"$version\"," src-tauri/tauri.conf.json

      - name: Build and upload macOS bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ github.ref_name }}
          assetNamePattern: "instant_[version]_[arch][ext]"
          args: --target ${{ matrix.target }}

  installer:
    needs:
      - bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and upload macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed \
            -e "s/@RELEASE_TAG@/$GITHUB_REF_NAME/g" \
            -e "s/@RELEASE_VERSION@/$version/g" \
            scripts/1_install.sh > "$RUNNER_TEMP/instant-installer.sh"
          chmod +x "$RUNNER_TEMP/instant-installer.sh"
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/instant-installer.sh#instant-installer.sh" \
            --clobber
