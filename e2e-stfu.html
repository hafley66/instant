<!doctype html>
<html><head><meta charset="UTF-8" /><title>panic button drag lab</title>
<style>body{margin:0;height:100vh;background:linear-gradient(#12161d,#07090c)}
#stfu-host{position:fixed;right:18px;bottom:18px;z-index:9999;pointer-events:none;
  transform:translate(var(--stfu-x,0px),var(--stfu-y,0px))}
#stfu-host .stfu-stage{pointer-events:auto;padding:0;transform:scale(0.42);transform-origin:100% 100%}
#log{position:fixed;top:8px;left:8px;font:12px ui-monospace,monospace;color:#9aa4b2}</style></head>
<body><div id="stfu-host"></div><pre id="log"></pre>
<script type="module">
import "/src/0_stfuButton.css"
import { mountStfuButton } from "/src/0_stfuButton.ts"
const log = document.getElementById("log")
window.moves = []
mountStfuButton(document.getElementById("stfu-host"), {
  position: { x: 0, y: 0 },
  onMoveEnd: (p) => { window.moves.push(p); log.textContent = `moved ${JSON.stringify(p)}` },
})
</script></body></html>
