<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monaco dock tab receipt</title>
    <style>#e2e-controls { position: fixed; z-index: 10; top: 6px; left: 74px; }</style>
    <script type="module" src="/e2e/monaco-tab.tsx" defer></script>
  </head>
  <body data-skin="xp">
    <div id="panel-pool" hidden></div>
    <button id="e2e-controls" data-testid="open-source">Open source file</button>
    <div id="app" class="window" style="height: calc(100vh - 16px)">
      <div class="window-body body" id="workbench">
        <nav class="actbar" id="actbar"><span class="actbar-spacer"></span></nav>
        <div class="actbar-resize" id="actbar-resize"></div>
        <div id="dock" class="dock"></div>
      </div>
    </div>
  </body>
</html>
